# Validates the skill and tests the README checker on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill structure and frontmatter
        run: python3 tools/validate_skill.py
      - name: Test the README checker
        run: python3 -m unittest discover tests -v
      - name: Check this repo's own README
        run: python3 skills/readme-organizer/scripts/check_readme.py .
